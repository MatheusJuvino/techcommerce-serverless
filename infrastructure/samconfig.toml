# Configuração padrão do AWS SAM CLI (sem credenciais).
# Uso (a partir da pasta infrastructure/):
#   sam build
#   sam deploy --guided        # primeira vez
#   sam deploy                 # próximas vezes
version = 0.1

[default.global.parameters]
stack_name = "techcommerce-serverless-dev"
region = "sa-east-1"

[default.build.parameters]
cached = true
parallel = true

[default.validate.parameters]
lint = true

[default.deploy.parameters]
capabilities = "CAPABILITY_IAM"
confirm_changeset = true
resolve_s3 = true
parameter_overrides = "Environment=dev ReportScheduleExpression=\"cron(0 6 * * ? *)\" EnableDemoEndpoints=true EnableFaultInjection=false"

[default.sync.parameters]
watch = true

[default.local_start_api.parameters]
warm_containers = "EAGER"
